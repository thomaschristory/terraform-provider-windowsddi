version: "2"
linters:
  default: standard
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - gosec
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
    - usetesting
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec
          - unparam
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/thomaschristory/terraform-provider-windowsddi
